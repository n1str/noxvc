# cargo audit: advisories for crates that are listed in Cargo.lock but never compiled.
# sqlx 0.8 lists every database driver in the lockfile (launchbadge/sqlx#3211); NoxVC builds only the postgres one
# (`cargo tree -e all --target all` has no sqlx-mysql / sqlx-sqlite / rsa / libsqlite3-sys).
[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa (Marvin attack) — via sqlx-mysql, not compiled
  "RUSTSEC-2026-0459", # libsqlite3-sys (SQLite CVE) — via sqlx-sqlite, not compiled
]
