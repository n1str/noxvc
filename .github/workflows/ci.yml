name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Web client (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    name: API tests (Docker stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the test stack
        run: |
          docker compose -f tests/stack/compose.yaml up -d --build
          for i in $(seq 1 120); do curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/api/me | grep -q 401 && exit 0; sleep 2; done
          docker compose -f tests/stack/compose.yaml logs relay; exit 1
      - name: Invite-only registration, permissions, messages, threads
        env:
          RELAY_URL: http://127.0.0.1:18099
        run: |
          for t in invites perms messages threads; do node --import=./tests/register-codes.mjs tests/$t.mjs; done

  desktop:
    name: Desktop (fmt, clippy, tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: desktop/src-tauri/Cargo.toml
          command: check licenses sources
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: |
          (cd web && npm audit --omit=dev)
          (cd desktop && npm audit --omit=dev)
