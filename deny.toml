# cargo deny check: dependency licenses (AGPL-3.0 compatible), advisories (RustSec), sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# listed in Cargo.lock but never compiled (sqlx MySQL/SQLite drivers, see .cargo/audit.toml)
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459"]

[licenses]
version = 2
confidence-threshold = 0.9
# permissive and weak-copyleft licenses compatible with distribution under AGPL-3.0
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0", "OpenSSL", "AGPL-3.0-only", "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
