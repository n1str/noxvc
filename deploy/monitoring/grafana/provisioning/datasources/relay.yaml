# Источник данных для дашбордов Relay: Prometheus на этом же хосте. Не «по умолчанию» — не меняет
# существующие настройки Grafana; дашборды выбирают источник через переменную $datasource.
apiVersion: 1
datasources:
  - name: Prometheus (NoxVC)
    uid: relay-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
