<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NoxVC</title>
<style>
  :root { color-scheme: dark; --bg: oklch(0.17 0.01 270); --text: oklch(0.96 0 0); --muted: oklch(0.7 0.01 270); --accent: oklch(0.66 0.17 275); --danger: oklch(0.65 0.2 25); }
  /* светлая тема (выбор в NoxVC; data-theme ставит приложение до загрузки страницы) */
  :root[data-theme='light'] { color-scheme: light; --bg: oklch(0.955 0.005 270); --text: oklch(0.22 0.012 270); --muted: oklch(0.47 0.014 270); --accent: oklch(0.52 0.19 275); --danger: oklch(0.52 0.2 25); }
  :root[data-theme='light'] body { background: radial-gradient(1000px 600px at 50% -10%, oklch(0.85 0.06 280 / 0.5), transparent), var(--bg); }
  :root[data-theme='light'] .bar { background: oklch(0.2 0.02 270 / 0.1); }
  :root[data-theme='light'] .warn { color: oklch(0.5 0.19 25); }
  :root[data-theme='light'] .titlebar { background: oklch(0.915 0.008 270); }
  :root[data-theme='light'] .titlebar button.tb:hover { background: oklch(0.2 0.02 270 / 0.08); }
  * { box-sizing: border-box; margin: 0; }
  body { height: 100vh; display: grid; place-items: center; background: radial-gradient(1000px 600px at 50% -10%, oklch(0.3 0.08 280 / 0.5), transparent), var(--bg);
    color: var(--text); font: 14px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; user-select: none; }
  main { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; max-width: 380px; padding: 24px; }
  img { width: 88px; height: 88px; animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(0.94); opacity: 0.85; } }
  .stopped img { animation: none; }
  h1 { font-size: 20px; } p { color: var(--muted); }
  .bar { width: 160px; height: 4px; border-radius: 2px; background: oklch(1 0 0 / 0.08); overflow: hidden; }
  .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  button { height: 38px; padding: 0 22px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: white; }
  button:hover { filter: brightness(1.1); }
  .warn { color: oklch(0.85 0.08 25); }
  [hidden] { display: none !important; }
  /* адрес сервера (сборка без RELAY_SERVER) */
  form { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
  label { font-weight: 600; font-size: 13px; }
  input { height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid oklch(1 0 0 / 0.14); background: oklch(0 0 0 / 0.25); color: var(--text); font: inherit; user-select: text; }
  :root[data-theme='light'] input { border-color: oklch(0.2 0.02 270 / 0.2); background: white; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .err { color: var(--danger); font-size: 13px; }
  button.link { height: auto; padding: 0; background: none; color: var(--accent); font-weight: 600; }
  /* свой заголовок окна (как в клиенте) */
  .titlebar { position: fixed; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; background: oklch(0.13 0.008 275); color: var(--text); font-size: 12px; font-weight: 600; }
  .titlebar .brand { display: flex; align-items: center; gap: 8px; padding-left: 12px; flex: 1; pointer-events: none; }
  .titlebar .brand img { width: 16px; height: 16px; animation: none; }
  .titlebar button.tb { width: 46px; height: 32px; padding: 0; border-radius: 0; background: transparent; color: var(--text); display: grid; place-items: center; }
  .titlebar button.tb:hover { filter: none; background: oklch(1 0 0 / 0.1); }
  .titlebar button.tb.close:hover { background: #c42b1c; color: white; }
  .titlebar.blurred .brand, .titlebar.blurred button.tb:not(:hover) { color: var(--muted); opacity: 0.7; }
  @media (prefers-reduced-motion: reduce) { img, .bar::after { animation: none; } }
</style>
</head>
<body>
<header class="titlebar" id="tb" data-tauri-drag-region="deep" hidden>
  <div class="brand"><img src="logo.png" alt="" /><span>NoxVC</span></div>
  <button class="tb" id="tb-min" aria-label="Свернуть" title="Свернуть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5.5h10" stroke="currentColor" shape-rendering="crispEdges"/></svg></button>
  <button class="tb" id="tb-max" aria-label="Развернуть"><svg width="10" height="10" viewBox="0 0 10 10"><path id="tb-max-d" d="M0.5 0.5h9v9h-9z" fill="none" stroke="currentColor" shape-rendering="crispEdges"/></svg></button>
  <button class="tb close" id="tb-close" aria-label="Закрыть" title="Закрыть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" shape-rendering="crispEdges"/></svg></button>
</header>
<main id="main">
  <img src="logo.png" alt="" />
  <h1 id="title">Подключение…</h1>
  <div class="bar" id="bar"></div>
  <p id="text" hidden></p>
  <button id="retry" hidden>Повторить</button>
  <form id="server" hidden>
    <label for="url" id="url-label">Адрес сервера</label>
    <input id="url" type="text" placeholder="https://app.example.com" autocomplete="url" spellcheck="false" required>
    <p class="err" id="url-err" hidden></p>
    <button type="submit" id="url-go">Подключиться</button>
  </form>
  <button class="link" id="change" hidden>Изменить адрес сервера</button>
</main>
<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  // русский — по умолчанию; английский — если язык системы не русский
  const RU = /^ru/i.test(navigator.language || 'ru');
  const T = RU ? {
    offline: ['Нет соединения с сервером', 'Проверьте интернет. NoxVC подключится, как только связь появится.'],
    untrusted: ['Не удаётся проверить сервер', 'Сервер предъявил неизвестный ключ безопасности — соединение остановлено. Обновите NoxVC до последней версии.'],
    connecting: 'Подключение…', retry: 'Повторить', server: 'Адрес сервера', go: 'Подключиться', change: 'Изменить адрес сервера',
    ask: 'Подключение к серверу', askText: 'Укажите адрес сервера NoxVC — его даёт администратор.', bad: 'Укажите адрес вида https://app.example.com',
  } : {
    offline: ['Cannot reach the server', 'Check your connection. NoxVC will connect as soon as it is back.'],
    untrusted: ['Cannot verify the server', 'The server presented an unknown security key — the connection was stopped. Update NoxVC to the latest version.'],
    connecting: 'Connecting…', retry: 'Retry', server: 'Server address', go: 'Connect', change: 'Change server address',
    ask: 'Connect to a server', askText: 'Enter the address of your NoxVC server — your admin will give it to you.', bad: 'Enter an address like https://app.example.com',
  };
  const MSG = { offline: T.offline, untrusted: T.untrusted };
  let builtIn = true;
  $('retry').textContent = T.retry; $('url-label').textContent = T.server; $('url-go').textContent = T.go; $('change').textContent = T.change;
  function askServer(err) {
    clearTimeout(timer);
    $('main').classList.add('stopped');
    $('title').textContent = T.ask; $('title').classList.remove('warn');
    $('text').textContent = T.askText; $('text').hidden = false;
    $('bar').hidden = true; $('retry').hidden = true; $('change').hidden = true;
    $('server').hidden = false; $('url-err').hidden = !err; $('url-err').textContent = err || '';
    $('url').focus();
  }
  $('server').onsubmit = async (e) => {
    e.preventDefault();
    try { await invoke('server_set', { url: $('url').value }); $('server').hidden = true; go(); }
    catch (err) { askServer(typeof err === 'string' ? (RU ? err : T.bad) : T.bad); }
  };
  $('change').onclick = () => askServer();
  let timer = null;
  async function go() {
    clearTimeout(timer);
    $('main').classList.remove('stopped');
    $('title').textContent = T.connecting; $('server').hidden = true; $('change').hidden = true;
    $('title').classList.remove('warn');
    $('bar').hidden = false; $('text').hidden = true; $('retry').hidden = true;
    let r;
    try { r = await invoke('connect'); } catch { r = { status: 'offline' }; }
    if (r.status === 'ok') return; // окно уже переходит на клиент
    if (r.status === 'no_server') return askServer();
    const [title, text] = MSG[r.status] || MSG.offline;
    $('main').classList.add('stopped');
    $('title').textContent = title;
    $('title').classList.toggle('warn', r.status === 'untrusted');
    $('text').textContent = text;
    $('bar').hidden = true; $('text').hidden = false; $('retry').hidden = false; $('change').hidden = builtIn;
    // Нет сети — пробуем сами каждые 5 секунд; чужой ключ — только по кнопке.
    if (r.status === 'offline') timer = setTimeout(go, 5000);
  }
  // Заголовок окна — только если окно без системной рамки.
  (async () => {
    const w = window.__TAURI__.window?.getCurrentWindow?.();
    if (!w || await w.isDecorated().catch(() => true)) return;
    $('tb').hidden = false;
    let snap;
    const sync = async () => { const m = await w.isMaximized().catch(() => false); $('tb-max-d').setAttribute('d', m ? 'M2.5 2.5h7v7h-7zM2.5 2.5v-2h7.5v7.5h-2' : 'M0.5 0.5h9v9h-9z'); $('tb-max').setAttribute('aria-label', m ? 'Свернуть в окно' : 'Развернуть'); };
    sync(); w.onResized(sync);
    // активность окна — от приложения (активное окно Windows), а не фокус Tauri: он уходит в WebView после клика
    const active = (a) => $('tb').classList.toggle('blurred', !a);
    invoke('window_active').then(active).catch(() => {});
    window.__TAURI__.event.listen('window-active', (e) => active(e.payload));
    $('tb-min').onclick = () => w.minimize();
    $('tb-max').onclick = () => { clearTimeout(snap); w.toggleMaximize(); };
    $('tb-max').onmouseenter = () => { clearTimeout(snap); snap = setTimeout(() => invoke('snap_layout').catch(() => {}), 500); };
    $('tb-max').onmouseleave = $('tb-max').onmousedown = () => clearTimeout(snap);
    $('tb-close').onclick = () => w.close();
  })();
  $('retry').onclick = go;
  // сначала — задан ли адрес при сборке (от этого зависит «Изменить адрес сервера»)
  invoke('server_get').then((i) => { builtIn = !!i?.built_in; if (i?.url) $('url').value = i.url; }).catch(() => {}).finally(go);
</script>
</body>
</html>
