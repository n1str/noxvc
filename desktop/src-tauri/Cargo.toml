[package]
name = "relay-desktop"
version = "0.1.0"
description = "Relay — десктоп-клиент"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "relay_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Проверка сертификата сервера (закрепление ключа): свой верификатор, без системных корней.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# Публичные корневые сертификаты для точек входа с сертификатом Let's Encrypt (уже в дереве через livekit).
webpki-roots = "=1.0.11"
# проверка подписи обновлений (Ed25519) — та же версия, что уже у rustls
ring = "=0.17.14"
base64 = "0.22"

# Нативная демонстрация экрана (как в Discord): свой выбор окна/экрана, захват Windows Graphics Capture,
# кодирование и публикация в LiveKit из приложения, звук — WASAPI loopback (без звука самого Relay).
livekit = { version = "=0.9.7", features = ["rustls-tls-webpki-roots"] }
png = "=0.18.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

# Глобальная клавиша рации: низкоуровневые хуки Windows (наблюдают, не перехватывают клавиши у других программ).
[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
# Свой захват на D3D11-устройстве с поддержкой видео и аппаратный H.264 через Media Foundation
# (та же версия, что у windows-capture, — новых крейтов не тянет).
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Metadata", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Storage_Xps", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
wasapi = "=0.27.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
