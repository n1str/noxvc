<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NoxDemo — макет обложки</title>
<style>
  body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0f0d1a; font-family: 'Segoe UI', system-ui, sans-serif; color: #f1eefc; }
  .bg { position: absolute; inset: 0; background: radial-gradient(60% 70% at 70% 40%, #5b33b8 0%, transparent 60%), radial-gradient(40% 50% at 15% 80%, #c2537a 0%, transparent 65%), linear-gradient(160deg, #181430, #0c0a16); }
  svg.waves { position: absolute; left: 0; bottom: 0; }
  .card { position: absolute; left: 80px; top: 110px; width: 520px; }
  .tag { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 18px; letter-spacing: .02em; }
  h1 { font-size: 76px; line-height: 1.02; margin: 26px 0 18px; letter-spacing: -0.03em; }
  p { font-size: 24px; color: #d6cff0; margin: 0; line-height: 1.45; }
  .swatches { display: flex; gap: 14px; margin-top: 40px; }
  .swatches i { width: 54px; height: 54px; border-radius: 14px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .moon { position: absolute; right: 170px; top: 120px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4d6, #f3c27a 60%, #c27a4a); box-shadow: 0 0 120px rgba(243,194,122,.55); }
  .moon::after { content: ''; position: absolute; left: 70px; top: -30px; width: 220px; height: 220px; border-radius: 50%; background: #2a1d55; opacity: .92; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="moon"></div>
  <svg class="waves" width="1280" height="320" viewBox="0 0 1280 320">
    <path d="M0 170 C220 90 420 250 680 160 S1060 80 1280 150 V320 H0Z" fill="#2a1d55" opacity=".9"/>
    <path d="M0 230 C260 170 540 300 800 220 S1120 170 1280 210 V320 H0Z" fill="#160f2e"/>
  </svg>
  <div class="card">
    <span class="tag">Макет · версия 3</span>
    <h1>Обложка<br>«Ночной рейс»</h1>
    <p>Тёмная палитра, луна справа, волны снизу. Нужен вариант светлее для превью.</p>
    <div class="swatches"><i style="background:#2a1d55"></i><i style="background:#5b33b8"></i><i style="background:#c2537a"></i><i style="background:#f3c27a"></i></div>
  </div>
</body>
</html>
